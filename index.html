  <style>
    /* ─────────────────────────────────────────
       RESET & TOKENS
    ───────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #000000;
      --white:       #ffffff;
      --off-white:   rgba(255,255,255,0.87);
      --muted:       rgba(255,255,255,0.45);
      --divider:     rgba(255,255,255,0.08);
      --header-h:    66px;
      --font-ui:     'Josefin Sans', sans-serif;
      --font-serif:  'Cormorant Garamond', serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-ui);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ─────────────────────────────────────────
       HEADER
    ───────────────────────────────────────── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      /* starts transparent; JS adds .scrolled */
      background: transparent;
      transition: background 0.5s ease, backdrop-filter 0.5s ease;
    }

    #site-header.scrolled {
      background: rgba(0,0,0,0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* ── Profile photo (left) ── */
    .h-left {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .header-photo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* ── Name / Director (left-aligned) ── */
    .h-center {
      /* normal flex flow – sits at the left of the header */
    }

    .site-title {
      font-family: var(--font-ui);
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .site-title .sep {
      margin: 0 10px;
      opacity: 0.3;
    }

    /* ── Email (right) ── */
    .h-right {
      display: flex;
      justify-content: flex-end;
      flex: 0 0 140px;
    }

    .h-email {
      font-size: 19px;
      font-weight: 200;
      letter-spacing: 1.5px;
      color: var(--muted);
      transition: color 0.2s;
    }
    .h-email:hover { color: var(--white); }

    /* ─────────────────────────────────────────
       PROJECT CARDS
    ───────────────────────────────────────── */
    main { padding-top: var(--header-h); }

    .projects { display: flex; flex-direction: column; }

    /* push DANCING TO JERICHO down to match the black-bar visual weight above */
    .projects .project-card:last-child {
      margin-top: clamp(18px, 3.2vw, 45px);
    }

    .project-card {
      position: relative;
      width: 100%;
      height: 65vh;
      min-height: 320px;
      overflow: hidden;
      cursor: pointer;
    }

    .project-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .project-card:hover .project-thumb {
      transform: scale(1.05);
    }

    /* gradient scrim for legibility */
    .project-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 35%,
        rgba(0,0,0,0.68) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* title block – bottom-left */
    .project-meta {
      position: absolute;
      bottom: 34px;
      left: 42px;
      z-index: 2;
    }

    .project-cat {
      font-family: var(--font-ui);
      font-size: 21px;
      font-weight: 100;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 9px;
    }

    .project-name {
      font-family: var(--font-ui);
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--white);
    }

    /* play overlay – centre of card */
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      transform: translate(-50%, -50%) scale(0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .project-card:hover .play-overlay {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .play-ring {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-ring svg {
      width: 13px;
      height: 13px;
      fill: white;
      margin-left: 3px;
    }

    .play-label {
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 200;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }


    /* ─────────────────────────────────────────
       CONTACT SECTION
    ───────────────────────────────────────── */
    .contact-section {
      padding: 110px 40px 100px;
      text-align: center;
    }

    .contact-heading {
      font-family: var(--font-ui);
      font-size: 30px;
      font-weight: 200;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 14px;
    }

    .contact-sub {
      font-family: var(--font-ui);
      font-size: 21px;
      font-weight: 100;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 38px;
    }

    .contact-link {
      font-family: var(--font-ui);
      font-size: 25px;
      font-weight: 200;
      letter-spacing: 2.5px;
      color: var(--off-white);
      border-bottom: 1px solid rgba(255,255,255,0.22);
      padding-bottom: 3px;
      transition: color 0.2s, border-color 0.2s;
    }
    .contact-link:hover {
      color: var(--white);
      border-color: rgba(255,255,255,0.55);
    }

    /* ─────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────── */
    footer {
      padding: 28px 40px;
      border-top: 1px solid var(--divider);
      text-align: center;
    }

    footer p {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 100;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─────────────────────────────────────────
       RESPONSIVE – TABLET  (≤ 960px)
    ───────────────────────────────────────── */
    @media (max-width: 960px) {
      #site-header { padding: 0 28px; }
      .h-right { flex-basis: 80px; }
      .project-meta { left: 28px; bottom: 26px; }
    }

    /* ─────────────────────────────────────────
       RESPONSIVE – MOBILE  (≤ 680px)
    ───────────────────────────────────────── */
    @media (max-width: 680px) {
      :root { --header-h: 56px; }

      #site-header { padding: 0 18px; }

      /* hide email on small screens */
      .h-email { display: none; }
      .h-right { flex-basis: 20px; }

      .site-title {
        font-size: 13px;
        letter-spacing: 3.5px;
      }

      .h-center {
        padding-left: 14px;
      }

      /* 16:9 cards on mobile */
      .project-card {
        height: 56.25vw;
        min-height: 200px;
      }

      .project-meta {
        left: 18px;
        bottom: 18px;
      }

      .project-name {
        font-size: 32px;
        letter-spacing: 5px;
      }

      .project-cat {
        font-size: 14px;
        letter-spacing: 5px;
        margin-bottom: 6px;
      }

      .play-ring {
        width: 44px;
        height: 44px;
      }
      .play-ring svg { width: 11px; height: 11px; }

      .contact-section { padding: 80px 22px 70px; }
      .contact-heading { font-size: 21px; }
      footer { padding: 22px; }
    }

    /* ─────────────────────────────────────────
       RESPONSIVE – SMALL MOBILE  (≤ 420px)
    ───────────────────────────────────────── */
    @media (max-width: 420px) {
      /* just show "DIRECTOR" when space is very tight */
      .site-name-part { display: none; }
      .site-sep       { display: none; }

      .project-name { font-size: 26px; letter-spacing: 4px; }
    }

    /* ─────────────────────────────────────────
       TOUCH DEVICES – show play on tap (no hover)
    ───────────────────────────────────────── */
    @media (hover: none) {
      /* Always show a faint play button so it's discoverable on touch */
      .play-overlay {
        opacity: 0.55;
        transform: translate(-50%, -50%) scale(1);
      }
      .project-card:active .play-overlay { opacity: 1; }
      .project-card:active .project-thumb { transform: scale(1.02); }
    }
  </style>
</head>

      border:     'none',
      cursor:     'pointer',
      lineHeight: '1',
      fontFamily: "'Josefin Sans', sans-serif",
      letterSpacing: '1px',
    });

    const videoWrap = document.createElement('div');
    Object.assign(videoWrap.style, {
      width:       '88%',
      maxWidth:    '1100px',
      aspectRatio: '16/9',
      background:  '#000000',
      position:    'relative',
    });

    overlay.appendChild(closeBtn);
    overlay.appendChild(videoWrap);
    document.body.appendChild(overlay);

    function openOverlay(src) {
      if (!src) return;                    // no URL configured – skip
      videoWrap.innerHTML =
        `<iframe src="${src}" style="position:absolute;inset:0;width:100%;height:100%;border:none;"
         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
         referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
      overlay.style.opacity       = '1';
      overlay.style.pointerEvents = 'all';
    }

    function closeOverlay() {
      overlay.style.opacity       = '0';
      overlay.style.pointerEvents = 'none';
      videoWrap.innerHTML = '';
    }

    closeBtn.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

    document.querySelectorAll('.project-card').forEach(card => {
      card.addEventListener('click', () => {
        const key = card.getAttribute('aria-label').toLowerCase().replace(/\s+/g, '-');
        openOverlay(VIDEO_URLS[key] || '');
      });
    });
  </script>

</body>
</html>
